# Publica los APK del reloj y del celular en GitHub Releases al subir una etiqueta vX.Y.Z:
#   git tag v2.0.0 && git push origin v2.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBED_GEMINI_KEY: ${{ vars.EMBED_GEMINI_KEY }}
        run: |
          echo "OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}" > local.properties
          # La clave de Gemini queda dentro del APK público: solo se incluye si lo decides
          # creando la variable de repositorio EMBED_GEMINI_KEY=true (ver docs/release.md).
          if [ "${EMBED_GEMINI_KEY}" = "true" ]; then
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "HIDRASMART_KEYSTORE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin KEYSTORE_BASE64: los APK se firman con la clave de depuración."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :core:testReleaseUnitTest

      - name: Build release APKs
        env:
          HIDRASMART_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HIDRASMART_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HIDRASMART_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :wear:assembleRelease :mobile:assembleRelease

      - name: Rename APKs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp wear/build/outputs/apk/release/wear-release.apk "dist/HidraSmart-watch-${VERSION}.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/HidraSmart-phone-${VERSION}.apk"
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Descargas
            - **HidraSmart-phone**: instálalo en tu celular Android (8.0 o superior).
            - **HidraSmart-watch**: instálalo en tu reloj Wear OS 3 o superior (ver docs/installation.md).
