# Compila, prueba y revisa con lint en cada push y pull request.
# También arma los App Bundles de release (con R8) para detectar a tiempo si la ofuscación rompe algo.
# Los APK de depuración quedan como artefactos del run.
name: Android CI

on:
  push:
    branches: [main]
    # Los cambios solo del servidor los revisa server-ci.yml
    paths-ignore: ["server/**", "docs/server.md", ".github/workflows/server-*.yml"]
  pull_request:
    paths-ignore: ["server/**", "docs/server.md", ".github/workflows/server-*.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Variable de repositorio con la URL pública del servidor; vacía = solo IA local
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      # Datos públicos del proyecto de Firebase para App Check (variables, no secretos)
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (calculator and AI)
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      - name: Lint (los errores hacen fallar el build)
        run: ./gradlew --no-daemon :wear:lintDebug :mobile:lintDebug

      - name: Build debug APKs
        run: ./gradlew --no-daemon :wear:assembleDebug :mobile:assembleDebug

      - name: Build release App Bundles (verifica R8)
        run: ./gradlew --no-daemon :wear:bundleRelease :mobile:bundleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports
          path: |
            wear/build/reports/lint-results-debug.html
            mobile/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: hidrasmart-debug-apks
          path: |
            wear/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
