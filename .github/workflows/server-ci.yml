# Pruebas del servidor hidrasmart-api en cada push y pull request que toque server/.
name: Server CI

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (dependencias con vulnerabilidades altas o críticas)
        run: npm audit --omit=dev --audit-level=high

      - name: Docker image builds
        run: docker build -t hidrasmart-api:ci .
